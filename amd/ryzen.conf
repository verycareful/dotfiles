# CPU limits applied by ryzenadj-apply.service at boot and after resume (the SMU forgets
# them on every power cycle). Edit, then: sudo ./amd/install-ryzenadj.sh
# Ryzen 9 7900X = "Dragon Range" family in RyzenAdj; supported knobs on it:
#   --tctl-temp=°C        thermal limit (stock 95)
#   --stapm-limit=mW  --fast-limit=mW  --slow-limit=mW    package power (PPT); stock 230000
#   --vrm-current=mA      TDC; stock 160000
#   --coall=N             Curve Optimizer, all cores. Negative = undervolt, e.g. --coall=-15
#                         (the value is passed as unsigned: use $((2**32 - 15)) for -15)
#   --coper=((core<<20)|(offset & 0xffff))   per-core CO
RYZENADJ_ARGS=--tctl-temp=85
