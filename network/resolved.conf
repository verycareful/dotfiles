# systemd-resolved: every lookup goes to the AdGuard DNS profile over TLS, on every network.
# Installed as /etc/systemd/resolved.conf.d/adguard.conf by install-network.sh, which swaps
# @ID@ for the profile ID (kept out of the repo: it identifies the profile).
[Resolve]
DNS=94.140.14.49#@ID@.d.adguard-dns.com 94.140.14.59#@ID@.d.adguard-dns.com
DNSOverTLS=yes
# no silent fallback to Quad9/Cloudflare/Google when AdGuard is unreachable
FallbackDNS=
# avahi answers mDNS (printers, .local); two responders on one socket fight
MulticastDNS=no
LLMNR=no
