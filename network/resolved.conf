# systemd-resolved: no global servers. Each link gets only what its networkd file says
# (Ethernet and Wi-Fi settings, chosen in the panel's DNS card).
# Installed as /etc/systemd/resolved.conf.d/10-dotfiles.conf.
[Resolve]
DNS=
# no silent fallback to Quad9/Cloudflare/Google
FallbackDNS=
# avahi answers mDNS (printers, .local); two responders on one socket fight
MulticastDNS=no
LLMNR=no
