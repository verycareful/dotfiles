# ClamAV on-access: DETECT tier (notify-only, nothing waits).
# Watches all of /home/sricharan; a file is scanned when written+closed,
# moved in, or opened, and quarantined if infected. Excludes pure churn dirs
# that have no inbound path (the weekly scan still covers them).
# Overlaps the blocking tier on purpose: it handles files 10M–100M there.
# Read by: clamonacc -c (systemd: clamav-clamonacc@notify.service)
#
# IMPORTANT: OnAccessExcludePath is an *unanchored regex* matched against
# every directory in the watched tree (clamonacc 1.5, inotif.c). A plain path
# like "/home/u/.cache" matches all of its subdirectories too, and clamonacc's
# hierarchy-removal recursion has a length bug that leaves children behind;
# the combination makes DDD abort with "can't exclude ..." and silently watch
# only the top level. Anchor every pattern with ^ and $ so it matches exactly
# ONE directory: the root of the subtree to drop. Escape dots.

LocalSocket /run/clamav/clamd.ctl

OnAccessPrevention no
OnAccessExtraScanning yes

OnAccessIncludePath /home/sricharan

# game libraries / runtimes (thousands of reads per second while playing)
OnAccessExcludePath ^/home/sricharan/\.local/share/Steam$
OnAccessExcludePath ^/home/sricharan/\.steam$
# app caches: browsers, media, shaders, fonts, thumbnails, build caches
OnAccessExcludePath ^/home/sricharan/\.cache/mozilla$
OnAccessExcludePath ^/home/sricharan/\.cache/thunderbird$
OnAccessExcludePath ^/home/sricharan/\.cache/spotify$
OnAccessExcludePath ^/home/sricharan/\.cache/Google$
OnAccessExcludePath ^/home/sricharan/\.cache/Microsoft$
OnAccessExcludePath ^/home/sricharan/\.cache/mesa_shader_cache$
OnAccessExcludePath ^/home/sricharan/\.cache/radv_builtin_shaders$
OnAccessExcludePath ^/home/sricharan/\.cache/qtshadercache-x86_64-little_endian-lp64$
OnAccessExcludePath ^/home/sricharan/\.cache/thumbnails$
OnAccessExcludePath ^/home/sricharan/\.cache/fontconfig$
OnAccessExcludePath ^/home/sricharan/\.cache/go-build$
OnAccessExcludePath ^/home/sricharan/\.cache/claude-cli-nodejs$
# Gradle wrapper distributions and dependency caches (GBs of jars). Scanning on open means every Gradle
# daemon or IDE start rescans them: one 60 MB compiler jar holds a core for 30-90 s, over and over.
OnAccessExcludePath ^/home/sricharan/\.gradle$
# app state/profile dirs under ~/.config with constant sqlite/tmp churn and no inbound path
# (downloads from these apps land in ~/Downloads, which the block tier covers)
OnAccessExcludePath ^/home/sricharan/\.config/mozilla$
OnAccessExcludePath ^/home/sricharan/\.config/Claude$
OnAccessExcludePath ^/home/sricharan/\.config/discord$
OnAccessExcludePath ^/home/sricharan/\.config/heroic$
OnAccessExcludePath ^/home/sricharan/\.config/Signal$
OnAccessExcludePath ^/home/sricharan/\.config/Code$
# Claude Code transcripts/state: constant writes, nothing inbound
OnAccessExcludePath ^/home/sricharan/\.claude$
# deleted files
OnAccessExcludePath ^/home/sricharan/\.local/share/Trash$
# GVFS metadata journal: transient temp files, constant rewrites
OnAccessExcludePath ^/home/sricharan/\.local/share/gvfs-metadata$
# Minecraft (ATLauncher): world saves and Xaero map caches churn constantly while playing (temp/backup
# files appear and vanish within a second → "Can't open file … for safe quarantine action" noise).
# Anchored so it matches exactly the saves/ and xaero/ dir of each instance, never their children;
# mods/ and the library jars stay covered. The weekly scan still covers everything.
OnAccessExcludePath ^/home/sricharan/\.local/share/atlauncher/instances/[^/]+/(saves|xaero)$

OnAccessExcludeUname clamav

OnAccessMaxFileSize 100M
OnAccessMaxThreads 10
OnAccessRetryAttempts 3
OnAccessCurlTimeout 10000
