# ClamAV on-access: BLOCKING tier.
# Every open()/read() in these directories is held until clamd returns a
# verdict; infected files are denied and moved to quarantine. Keep this list
# to directories where files ARRIVE from outside and are read rarely. The
# per-read cost (~3-10 ms) makes it unsuitable for caches, games or code trees.
# Read by: clamonacc -c (systemd: clamav-clamonacc@block.service)

LocalSocket /run/clamav/clamd.ctl

OnAccessPrevention yes
OnAccessExtraScanning yes

OnAccessIncludePath /home/sricharan/Downloads
OnAccessIncludePath /home/sricharan/Desktop
OnAccessIncludePath /home/sricharan/Documents
OnAccessIncludePath /home/sricharan/Pictures
OnAccessIncludePath /home/sricharan/Videos
OnAccessIncludePath /home/sricharan/Music
OnAccessIncludePath /home/sricharan/Public
OnAccessIncludePath /home/sricharan/Templates
# AUR build dir: sources and -bin payloads land here before makepkg packages them
OnAccessIncludePath /home/sricharan/.cache/yay

# clamd (user clamav) reads files via passed fd: it must be excluded or we deadlock
OnAccessExcludeUname clamav

# Files above this size are NOT scanned by this tier (the notify tier covers up to 100M)
OnAccessMaxFileSize 10M
OnAccessMaxThreads 10
OnAccessRetryAttempts 3
# If clamd is unreachable, allow access rather than freeze the desktop
OnAccessDenyOnError no
OnAccessCurlTimeout 10000
