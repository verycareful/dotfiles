# cava settings for the song visualiser (services/Viz.qml reads the raw output on stdout).
# One frame per line, bar heights 0 to 1000 separated by ';'. Light smoothing and a high frame rate keep the bars
# in step with the music: noise_reduction is cava's fall smoothing (higher is slower), and a high bar count keeps
# the rise quick, since cava sizes its bass window by the lowest bar. monstercat spreads each peak to its
# neighbours and is off. Views group the 160 bars down to the width they draw (Viz.bins). One channel (the average
# of both) puts the lowest frequencies in the first bar and the highest in the last. cava-stereo.conf is this file
# with `channels = stereo`; keep the two in step.

[general]
bars = 160
framerate = 60
autosens = 1
sleep_timer = 3

[input]
method = pipewire
source = auto

[output]
method = raw
channels = mono
mono_option = average
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
monstercat = 0
waves = 0
noise_reduction = 15
