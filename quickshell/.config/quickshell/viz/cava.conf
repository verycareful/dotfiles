# cava settings for the full-width song visualiser (viz/BarViz.qml reads the raw output on stdout).
# One frame per line, bar heights 0 to 1000 separated by ';'.

[general]
bars = 160
framerate = 60
autosens = 1
sleep_timer = 3

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
monstercat = 1
noise_reduction = 77
