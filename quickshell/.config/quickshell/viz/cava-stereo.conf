# cava settings for the song visualiser, stereo layout (services/Viz.qml reads the raw output on stdout).
# One frame per line, bar heights 0 to 1000 separated by ';'. Light smoothing and a high frame rate keep the bars
# in step with the music: noise_reduction is cava's fall smoothing (higher is slower), and a high bar count keeps
# the rise quick, since cava sizes its bass window by the lowest bar. monstercat spreads each peak to its
# neighbours and is off. Views group the 160 bars down to the width they draw (Viz.bins). Two channels put the left
# channel first with its lowest frequency in the middle, mirrored about it (Viz.mirrored). cava.conf is this file
# with one channel; keep the two in step.

[general]
bars = 160
framerate = 60
autosens = 1
sleep_timer = 3

[input]
method = pipewire
source = auto

[output]
method = raw
channels = stereo
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
monstercat = 0
waves = 0
noise_reduction = 15
