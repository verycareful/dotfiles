# kitty — "Harbour". Colours in harbour.conf.
include harbour.conf

# ── font ─────────────────────────────────────────────────────
font_family      Share Tech Mono
# Share Tech Mono is Regular-only; kitty fakes bold
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.5
disable_ligatures never
modify_font cell_height 110%
# Nerd Font icon ranges → JetBrainsMono Nerd Font (Share Tech Mono has no icons)
symbol_map U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7,U+E700-U+E8EF,U+EA60-U+EC1E,U+ED00-U+F2FF,U+F300-U+F381,U+F400-U+F533,U+F0001-U+F1AF0 JetBrainsMono Nerd Font

# ── window ───────────────────────────────────────────────────
# glass; Hyprland blurs behind
background_opacity      0.78
dynamic_background_opacity yes
window_padding_width    12
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size    no
initial_window_width    110c
initial_window_height   30c
enable_audio_bell       no
visual_bell_duration    0

# ── cursor / scroll ──────────────────────────────────────────
cursor_shape            beam
cursor_beam_thickness   1.5
cursor_blink_interval   0.6
scrollback_lines        10000
mouse_hide_wait         2.0
url_style               single
copy_on_select          clipboard
strip_trailing_spaces   smart

# ── tabs ─────────────────────────────────────────────────────
tab_bar_edge            top
tab_bar_style           separator
tab_separator           " ┃ "
tab_bar_margin_height   4 0
tab_title_template      {index} {title}
active_tab_font_style   bold
inactive_tab_font_style normal

# ── keys ─────────────────────────────────────────────────────
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+w     close_tab
map ctrl+tab         next_tab
map ctrl+shift+tab   previous_tab
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0
map ctrl+shift+f     show_scrollback
