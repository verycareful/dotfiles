# GENERATED by `theme` from themes/templates — edit the template, not this file.
# hyprlock — blurred screenshot background, big clock, one input field.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    vibrancy = 0.15
    noise = 0.02
}

label {                                   # clock
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgb({{text}})
    font_size = 96
    font_family = Quantico Bold
    position = 0, 160
    halign = center
    valign = center
}
label {                                   # date
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgb({{subtext}})
    font_size = 18
    font_family = Quantico
    position = 0, 70
    halign = center
    valign = center
}
label {                                   # user
    monitor =
    text = 󰀄  $USER
    color = rgb({{subtext}})
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 46
    position = 0, -110
    halign = center
    valign = center
    outline_thickness = 1
    rounding = 0
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    inner_color = rgba({{mantle}}99)
    outer_color = rgb({{overlay}})
    check_color = rgb({{primary_bright}})
    fail_color = rgb({{red}})
    font_color = rgb({{text}})
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span foreground="##{{muted}}">password</span>
    fail_text = <span foreground="##{{red}}">wrong ($ATTEMPTS)</span>
    fade_on_empty = false
    capslock_color = rgb({{accent}})
}
