# hyprtoolkit: the toolkit hyprpolkitagent (the password prompt) and the other hypr* GUIs draw with.
# Rendered by `theme`; it ignores qt6ct and GTK, so it needs its own colours.
background = rgb({{base}})
base = rgb({{surface}})
alternate_base = rgb({{mantle}})
text = rgb({{text}})
bright_text = rgb({{text}})
link_text = rgb({{blue_bright}})
accent = rgb({{accent}})
accent_secondary = rgb({{primary_bright}})

font_family = Oxanium
font_family_monospace = JetBrainsMono Nerd Font

rounding_large = 0
rounding_small = 0
