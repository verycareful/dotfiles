# hypridle — idle actions for a desktop (no suspend by default).
# Waybar's idle_inhibitor ("caffeine") pauses all of these while active.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.local/bin/hdsp 'hl.dsp.dpms({ action = "on" })' dpms on
    ignore_dbus_inhibit = false        # respect media players / browsers asking to stay awake
}

listener {                             # 10 min: lock
    timeout = 600
    on-timeout = loginctl lock-session
}
listener {                             # 15 min: screen off
    timeout = 900
    on-timeout = ~/.local/bin/hdsp 'hl.dsp.dpms({ action = "off" })' dpms off
    on-resume = ~/.local/bin/hdsp 'hl.dsp.dpms({ action = "on" })' dpms on
}
