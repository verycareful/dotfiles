# hypridle — idle actions for a desktop (no suspend by default).
# Waybar's idle_inhibitor ("caffeine") pauses all of these while active.
general {
    lock_cmd = ~/.local/bin/lockscreen   # hyprlock, restarted if it crashes before an unlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false        # respect media players / browsers asking to stay awake
}

listener {                             # 10 min: lock
    timeout = 600
    on-timeout = loginctl lock-session
}
listener {                             # 15 min: screen off
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
