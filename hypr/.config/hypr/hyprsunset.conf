# hyprsunset: night light schedule. Each profile applies from its time until the next one.
# The panel's Night light toggle overrides it until the next profile starts.
# Times are local and fixed: set the evening ones a little after your sunset.
max-gamma = 100

profile {
    time = 6:30
    identity = true
}

profile {
    time = 19:00
    temperature = 4500
}

profile {
    time = 22:30
    temperature = 3500
}
