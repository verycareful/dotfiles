# ── Layout ───────────────────────────────────────────────────
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    # Active border: orange → navy gradient at 45°, inactive: flat surface
    col.active_border   = $orange $navyBright 45deg
    col.inactive_border = $surface
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

dwindle {
    preserve_split = true
    smart_split = false
}

master {
    new_status = master
}

# ── Decoration ───────────────────────────────────────────────
decoration {
    rounding = 0              # sharp corners, per brief

    active_opacity   = 1.0
    inactive_opacity = 0.96
    dim_inactive = true
    dim_strength = 0.08

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true       # blur through semi-transparent surfaces
        xray = false
        noise = 0.015
        contrast = 1.0
        brightness = 0.9
        vibrancy = 0.15
        popups = true               # blur behind menus/tooltips
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000066)
        color_inactive = rgba(00000033)
    }
}

# ── Misc ─────────────────────────────────────────────────────
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = $base
    focus_on_activate = true
    animate_manual_resizes = false
    vrr = 0                     # 0 off, 1 on, 2 fullscreen-only
}

xwayland {
    force_zero_scaling = true
}
