# exec-once runs once at launch; exec runs on every config reload.
# waybar/swaync/hypridle/… run as user units: systemd restarts them if they crash
exec-once = systemctl --user start waybar swaync
exec-once = awww-daemon --no-cache
exec-once = sleep 1 && ~/.local/bin/wall set
exec-once = systemctl --user start hypridle hyprsunset hyprpolkitagent
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = easyeffects --gapplication-service
