# layerrule = RULE, match:namespace REGEX   — rules for layer-shell surfaces (bars, menus)
# Blur behind the glass surfaces; ignore_alpha stops fully transparent pixels from being blurred.
layerrule = blur on,        match:namespace ^(waybar|rofi|qs-notif-center|qs-notif-popups|logout_dialog)$
layerrule = ignore_alpha 0.2, match:namespace ^(waybar|rofi|qs-notif-center|qs-notif-popups|logout_dialog)$
layerrule = no_anim on,     match:namespace ^(selection)$
