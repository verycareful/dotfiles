input {
    kb_layout = us
    follow_mouse = 1          # focus follows mouse, but clicking still focuses
    sensitivity = 0           # -1.0 .. 1.0, 0 = no change
    accel_profile = flat      # no mouse acceleration (gaming-friendly)
    repeat_rate = 40
    repeat_delay = 300
    numlock_by_default = true

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# gesture = FINGERS, DIRECTION, ACTION   (Hyprland ≥ 0.51 syntax)
gesture = 3, horizontal, workspace
gesture = 3, pinchin,  float, tile
gesture = 3, pinchout, float, float
