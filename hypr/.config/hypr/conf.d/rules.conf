# windowrule = RULE, match:VALUE …
# Find a window's class/title with:  hyprctl clients

# Float small utility windows
windowrule = float on, match:class ^(pavucontrol|nwg-look|qt5ct|qt6ct|nm-connection-editor|blueman-manager)$
windowrule = size 900 600, match:class ^(pavucontrol)$
windowrule = center on, match:class ^(pavucontrol|nwg-look|qt5ct|qt6ct)$

# File pickers / dialogs
windowrule = float on, match:title ^(Open File|Save File|Open Folder|Select .*)$
windowrule = center on, match:title ^(Open File|Save File|Open Folder|Select .*)$

# Picture-in-picture always on top
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = pin on, match:title ^(Picture-in-Picture)$


# Fix xwayland drag-n-drop ghosts
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false

# Smart gaps: a lone tiled window (w[tv1]) or a fullscreen one (f[1]) fills the space (border stays as a focus cue)
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1],   gapsout:0, gapsin:0
