# ── Variables ────────────────────────────────────────────────
$mod      = SUPER
$term     = kitty
$browser  = firefox
$files    = thunar
$launcher = rofi -show drun
$editor   = code

# bind = MODS, KEY, DISPATCHER, ARGS
# Flags after "bind": e = repeat, l = works on lockscreen, m = mouse, r = on release

# ── Apps ─────────────────────────────────────────────────────
bind = $mod,       RETURN, exec, $term
bind = $mod,       B,      exec, $browser
bind = $mod,       E,      exec, $files
bind = $mod,       C,      exec, $editor
bind = $mod,       SPACE,  exec, $launcher
bind = $mod,       V,      exec, cliphist list | rofi -dmenu -p "clipboard" | cliphist decode | wl-copy
bind = $mod SHIFT, N,      exec, qs ipc call notifs toggle
bind = $mod,       A,      exec, qs ipc call panel toggle
bind = $mod SHIFT, T,      exec, ~/.local/bin/theme toggle
bind = $mod,       ESCAPE, exec, hyprlock
bind = $mod SHIFT, ESCAPE, exec, wlogout -b 5 -T 520 -B 520 -L 440 -R 440

# ── Screenshots (grim + slurp + satty) ───────────────────────
bind = ,      PRINT, exec, ~/.local/bin/shot area
bind = SHIFT, PRINT, exec, ~/.local/bin/shot full
bind = $mod,  PRINT, exec, ~/.local/bin/shot window

# ── Windows ──────────────────────────────────────────────────
bind = $mod,       Q, killactive
bind = $mod,       F, fullscreen, 0
bind = $mod SHIFT, F, togglefloating
bind = $mod,       W, togglefloating
bind = $mod,       P, pseudo
bind = $mod,       T, layoutmsg, togglesplit
bind = $mod SHIFT, P, pin
bind = $mod SHIFT, Q, exit

# Alt-Tab: cycle ALL windows in most-recently-used order (script), applied when Alt is released
bind  = ALT,       Tab,   exec, ~/.local/bin/altab --next
bind  = ALT SHIFT, Tab,   exec, ~/.local/bin/altab --prev
bindr = ALT,       ALT_L, exec, ~/.local/bin/altab --apply
bindr = ALT,       ALT_R, exec, ~/.local/bin/altab --apply

# Focus (arrows + vim keys)
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, H,     movefocus, l
bind = $mod, L,     movefocus, r
bind = $mod, K,     movefocus, u
bind = $mod, J,     movefocus, d

# Move window
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d
bind = $mod SHIFT, H,     movewindow, l
bind = $mod SHIFT, L,     movewindow, r
bind = $mod SHIFT, K,     movewindow, u
bind = $mod SHIFT, J,     movewindow, d

# Resize (hold to repeat)
binde = $mod CTRL, left,  resizeactive, -40 0
binde = $mod CTRL, right, resizeactive,  40 0
binde = $mod CTRL, up,    resizeactive,  0 -40
binde = $mod CTRL, down,  resizeactive,  0  40

# Mouse: drag to move / resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── Workspaces ───────────────────────────────────────────────
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod,       TAB,        workspace, previous
bind = $mod,       mouse_down, workspace, e+1
bind = $mod,       mouse_up,   workspace, e-1
bind = $mod,       S,          togglespecialworkspace, scratch
bind = $mod SHIFT, S,          movetoworkspace, special:scratch
# "close to tray": hide the window (keeps running) / pick a hidden one to bring back
bind = $mod,       M,          movetoworkspacesilent, special:tray
bind = $mod SHIFT, M,          exec, ~/.local/bin/untray

# ── Hardware keys ────────────────────────────────────────────
bindel = , XF86AudioRaiseVolume,  exec, pamixer -i 5
bindel = , XF86AudioLowerVolume,  exec, pamixer -d 5
bindl  = , XF86AudioMute,         exec, pamixer -t
bindl  = , XF86AudioMicMute,      exec, pamixer --default-source -t
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPrev,         exec, playerctl previous
