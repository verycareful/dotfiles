# bezier = NAME, x0, y0, x1, y1      (cubic-bezier easing curve)
# animation = NAME, ONOFF, SPEED(1 = 100ms), CURVE [, STYLE]
animations {
    enabled = true

    bezier = snap,    0.2, 0.9, 0.1, 1.0
    bezier = glide,   0.05, 0.9, 0.1, 1.0
    bezier = linear,  0, 0, 1, 1

    animation = windowsIn,   1, 3, snap,  slide
    animation = windowsOut,  1, 3, snap,  slide
    animation = windowsMove, 1, 3, glide
    animation = border,      1, 6, linear
    animation = fade,        1, 3, snap
    animation = layersIn,    1, 3, snap,  fade
    animation = layersOut,   1, 3, snap,  fade
    animation = workspaces,  1, 3, glide, slidefade 15%
}
