# hyprlock — lock screen. Blurred screenshot of the desktop as background,
# big clock, single input field with an orange caret.
source = ~/.config/hypr/conf.d/colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    vibrancy = 0.15
    noise = 0.02
}

# clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $text
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}
# date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = $subtext
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}
# user
label {
    monitor =
    text =   $USER
    color = $subtext
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 46
    position = 0, -110
    halign = center
    valign = center
    outline_thickness = 1
    rounding = 0
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    inner_color = rgba(17, 22, 36, 0.75)
    outer_color = $overlay
    check_color = $navyBright
    fail_color = $red
    font_color = $text
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span foreground="##5d6784">password</span>
    fail_text = <span foreground="##f0566a">wrong ($ATTEMPTS)</span>
    fade_on_empty = false
    capslock_color = $orange
}
