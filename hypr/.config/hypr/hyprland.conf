# ─────────────────────────────────────────────────────────────
#  Hyprland — entry point
#  Everything is split into conf.d/ so each concern is one file.
#  Order matters only where noted (colors first, binds last).
# ─────────────────────────────────────────────────────────────
source = ~/.config/hypr/conf.d/colors.conf
source = ~/.config/hypr/conf.d/monitors.conf
source = ~/.config/hypr/conf.d/env.conf
source = ~/.config/hypr/conf.d/input.conf
source = ~/.config/hypr/conf.d/look.conf
source = ~/.config/hypr/conf.d/animations.conf
source = ~/.config/hypr/conf.d/rules.conf
source = ~/.config/hypr/conf.d/autostart.conf
source = ~/.config/hypr/conf.d/binds.conf
