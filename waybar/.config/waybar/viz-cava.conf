# cava settings for the compact song visualiser (~/.local/bin/viz reads the raw output on stdout).
# One frame per line, bar heights 0 to 7 (one per glyph, ▁ to █) separated by ';'.

[general]
bars = 12
framerate = 30
autosens = 1
sleep_timer = 3

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
monstercat = 1
noise_reduction = 77
